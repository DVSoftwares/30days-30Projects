<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">  
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Password</title>
        <link rel="stylesheet" href="../output.css">
    </head>
    <body class="flex min-h-screen flex-col items-center justify-center bg-slate-950 p-4 font-sans text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">
        <div class="absolute top-4 left-4 rounded-full p-1">
            <img src="../Images/DVS lg white.png" class="h-8 w-auto bg-transparent" alt="Logo">
        </div>
        <main class="w-full max-w-md rounded-3xl border border-slate-800 bg-slate-900/90 p-6 shadow-2xl backdrop-blur-xl sm:p-8">
            <header class="text-center mb-6">
                <span class="text-sm font-bold uppercase tracking-widest text-emerald-400">Security Check</span>
                <h1 class="mt-2 text-2xl font-extrabold tracking-tight text-white sm:text-3xl">Create a strong password</h1>
                <p class="mt-2 text-sm text-slate-400">Enter your password to check if it's strong enough.</p>
            </header>
            <div class="relative mb-5">
               <input 
               class="w-full rounded-xl border border-slate-700 bg-slate-950/80 px-4 py-3 text-sm text-white placeholder-text-slate-500  transition focus:ring-1 focus:ring-emerald-500 focus:outline-none sm:text-base"
               type="password"
               placeholder="Enter your password..."
               id="passwordInput"
               >
                <button type="button"
                class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-sm font-semibold text-slate-400 transition hover:text-white cursor-pointer"
                id="toggleButton">
                Show
               </button>
            </div>

            <div class="mb-4">
                <div class="flex items-center justify-between text-xs font-medium text-slate-400 mb-1.5">
                    <span>Strength</span>
                    <span id="StrengthLabel">None</span>
                </div>

                <div class="h-2 rounded-full bg-slate-800 overflow-hidden">
                    <div id="StrengthBar" class="h-full w-0 bg-emerald-500 transition-all duration-300"></div>
                </div>
            </div>

            <ul class="space-y-2 rounded-xl border border-slate-800/80 bg-slate-950/40 p-4 text-xs font-medium">
                <li id="ruleLength" class="flex items-center gap-2 text-slate-500 transition-colors">
                    <span class="status-icon inline-block w-3 text-center">&#x25CB;</span>
                    <span >At least 8 characters</span>
                </li>
                <li id="ruleUpper" class="flex items-center gap-2 text-slate-500 transition-colors">
                    <span class="status-icon inline-block w-3 text-center">&#x25CB;</span>
                    <span>At least one uppercase letter(A-Z)</span>
                </li>
                <li id="ruleNumber" class="flex items-center gap-2 text-slate-500 transition-colors">
                    <span class="status-icon inline-block w-3 text-center">&#x25CB;</span>
                    <span>Includes at least one number(0-9)</span>
                </li>
                <li id="ruleSpecial" class="flex items-center gap-2 text-slate-500 transition-colors">
                    <span class="status-icon inline-block w-3 text-center">&#x25CB;</span>
                    <span>Includes at least one special character(!@#$%^&*)</span>
                </li>
            </ul>
        </main>
        <script src="password.js"></script>

    </body>
</html>
