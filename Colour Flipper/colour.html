<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">  
        <title>Colour Flipper</title>
        <link rel="stylesheet" href="../output.css">  
        
    </head>
    <body id="pageBody"  class="flex min-h-screen flex-col items-center justify-center bg-amber-50">
    <div class="absolute top-4 left-4 bg-cyan-500 rounded-full p-1">
        <img src="../Images/DVS lg.png" class="h-8 w-auto" alt="Logo">
    </div>
    </body>
        <main class="flex flex-col items-center gap-6 rounded-2xl bg-white p-8 shadow-2xl">
            <h1 class="text-3xl font-bold text-neutral-800">Colour Flipper</h1>
        <div class="flex items-center gap-4 rounded-lg bg-neutral-100 p-4 text-neutral-800" ring-1 ring-neutral-200>
            <span text-sm font-semibold uppercase text-neutral-500>
                BACKGROUND:
            </span>
            <span id="colourCode" class="text-sm font-semibold uppercase text-neutral-500">
                #E5E5E5
            </span>
            <button id="copyBtn" onclick="copyToClipboard()" class="ml-2 rounded-lg bg-neutral-900 px-2.5 py-1 text-xs font-semibold text-white transition hover:bg-neutral-700 active:scale-95 cursor-pointer">
                COPY
            </button>
        </div>
        <div class="flex flex-wrap items-center justify-center gap-4">
            <button id="red" class="rounded-full bg-red-500 px-4 py-2 text-white font-semibold transition hover:bg-red-600 active:scale-95 cursor-pointer" onclick="changeColour('red')">
                Red
            </button>
            <button id="green" class="rounded-full bg-green-500 px-4 py-2 text-white font-semibold transition hover:bg-green-600 active:scale-95 cursor-pointer" onclick="changeColour('green')">
                Green
            </button>
            <button id="blue" class="rounded-full bg-blue-500 px-4 py-2 text-white font-semibold transition hover:bg-blue-600 active:scale-95 cursor-pointer" onclick="changeColour('blue')">
                Blue
            </button>
            <button id="random-btn" class="rounded-full bg-gray-500 px-4 py-2 text-white font-semibold transition hover:bg-gray-600 active:scale-95 cursor-pointer " onclick="randomColour('random')">
                Random
            </button>
        </div>
        </main>
        <script src="colour.js"></script>
    </body>
</html>
